name: llama.cpp Android native libraries

on:
  push:
    branches:
      - feature/multimodal-runtime-foundation
    paths:
      - "docs/NATIVE_ANDROID_RUNTIME.md"
      - ".github/workflows/llama-android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llama-android-native-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout AETHRA
        uses: actions/checkout@v4

      - name: Checkout pinned llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: b11960
          path: third_party/llama.cpp

      - name: Install Android NDK
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK and CMake
        run: |
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.31.6"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Configure llama.cpp and libmtmd for Android
        run: |
          cmake -S third_party/llama.cpp -B build/llama-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_SUBPROCESS=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_MTMD=ON \
            -DMTMD_VIDEO=OFF \
            -DBUILD_SHARED_LIBS=ON

      - name: Build llama and mtmd shared libraries
        run: cmake --build build/llama-android --target llama mtmd --config Release --parallel 2

      - name: Collect native libraries
        run: |
          mkdir -p artifacts/arm64-v8a
          find build/llama-android -type f \( -name "libllama.so*" -o -name "libmtmd.so*" -o -name "libggml*.so*" \) -exec cp -v {} artifacts/arm64-v8a/ \;
          test -f artifacts/arm64-v8a/libllama.so
          test -f artifacts/arm64-v8a/libmtmd.so
          printf "Pinned llama.cpp commit: " && git -C third_party/llama.cpp rev-parse HEAD
          ls -lh artifacts/arm64-v8a

      - name: Upload arm64 native libraries
        uses: actions/upload-artifact@v4
        with:
          name: aethra-llama-mtmd-arm64-v8a
          path: artifacts/arm64-v8a/
          if-no-files-found: error
          retention-days: 14
